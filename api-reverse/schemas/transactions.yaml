openapi: 3.0.3
info:
  title: Fineract Transactions & Accounts API Spec (Reconstructed)
  description: Reconstructed savings accounts, deposits, and internal transfers from
    captured traffic logs.
  version: 1.0.0
servers:
- url: http://127.0.0.1:8080/fineract-provider/api/v1
paths:
  /savingsaccounts:
    post:
      summary: Submit savings account application
      tags:
      - Savings Accounts
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientId
              - productId
              - submittedOnDate
              - dateFormat
              - locale
              properties:
                clientId:
                  type: integer
                  example: 6
                productId:
                  type: integer
                  example: 1
                submittedOnDate:
                  type: string
                  example: 16 June 2026
                dateFormat:
                  type: string
                  example: dd MMMM yyyy
                locale:
                  type: string
                  example: en
      responses:
        '200':
          description: Savings application submitted
          content:
            application/json:
              schema:
                type: object
                required:
                - officeId
                - clientId
                - savingsId
                - resourceId
                - gsimId
                properties:
                  officeId:
                    type: integer
                    example: 1
                  clientId:
                    type: integer
                    example: 7
                  savingsId:
                    type: integer
                    example: 7
                  resourceId:
                    type: integer
                    example: 7
                  gsimId:
                    type: integer
                    example: 0
  /savingsaccounts/{accountId}:
    post:
      summary: Approve or activate savings account application
      tags:
      - Savings Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      - name: command
        in: query
        required: true
        schema:
          type: string
          enum:
          - approve
          - activate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - approvedOnDate
                - dateFormat
                - locale
                properties:
                  approvedOnDate:
                    type: string
                    example: 16 June 2026
                  dateFormat:
                    type: string
                    example: dd MMMM yyyy
                  locale:
                    type: string
                    example: en
              - type: object
                required:
                - activatedOnDate
                - dateFormat
                - locale
                properties:
                  activatedOnDate:
                    type: string
                    example: 16 June 2026
                  dateFormat:
                    type: string
                    example: dd MMMM yyyy
                  locale:
                    type: string
                    example: en
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - officeId
                  - clientId
                  - savingsId
                  - resourceId
                  - changes
                  properties:
                    officeId:
                      type: integer
                      example: 1
                    clientId:
                      type: integer
                      example: 6
                    savingsId:
                      type: integer
                      example: 6
                    resourceId:
                      type: integer
                      example: 6
                    changes:
                      type: object
                      properties:
                        status:
                          type: object
                          properties:
                            id:
                              type: integer
                            code:
                              type: string
                            value:
                              type: string
                            submittedAndPendingApproval:
                              type: boolean
                            approved:
                              type: boolean
                            rejected:
                              type: boolean
                            withdrawnByApplicant:
                              type: boolean
                            active:
                              type: boolean
                            closed:
                              type: boolean
                            prematureClosed:
                              type: boolean
                            transferInProgress:
                              type: boolean
                            transferOnHold:
                              type: boolean
                            matured:
                              type: boolean
                        locale:
                          type: string
                        dateFormat:
                          type: string
                        approvedOnDate:
                          type: string
                - type: object
                  required:
                  - officeId
                  - clientId
                  - savingsId
                  - resourceId
                  - changes
                  properties:
                    officeId:
                      type: integer
                      example: 1
                    clientId:
                      type: integer
                      example: 6
                    savingsId:
                      type: integer
                      example: 6
                    resourceId:
                      type: integer
                      example: 6
                    changes:
                      type: object
                      properties:
                        status:
                          type: object
                          properties:
                            id:
                              type: integer
                            code:
                              type: string
                            value:
                              type: string
                            submittedAndPendingApproval:
                              type: boolean
                            approved:
                              type: boolean
                            rejected:
                              type: boolean
                            withdrawnByApplicant:
                              type: boolean
                            active:
                              type: boolean
                            closed:
