                            prematureClosed:
                              type: boolean
                            transferInProgress:
                              type: boolean
                            transferOnHold:
                              type: boolean
                            matured:
                              type: boolean
                        locale:
                          type: string
                        dateFormat:
                          type: string
                        activatedOnDate:
                          type: string
