  /savingsaccounts/{accountId}/transactions:
    post:
      summary: Post a savings account transaction
      tags:
      - Transactions
      security:
      - BasicAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
      - name: command
        in: query
        required: true
        schema:
          type: string
          enum:
          - deposit
          - withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - locale
              - dateFormat
              - transactionDate
              - transactionAmount
              - paymentTypeId
              properties:
                locale:
                  type: string
                  example: en
                dateFormat:
                  type: string
                  example: dd MMMM yyyy
                transactionDate:
                  type: string
                  example: 16 June 2026
                transactionAmount:
                  type: number
                  example: 1000.0
                paymentTypeId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Transaction posted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - officeId
                - clientId
                - savingsId
                - resourceId
                - changes
                properties:
                  officeId:
                    type: integer
                    example: 1
                  clientId:
                    type: integer
                    example: 6
                  savingsId:
                    type: integer
                    example: 6
                  resourceId:
                    type: integer
                    example: 8
                  changes:
                    type: object
                    properties:
                      paymentTypeId:
                        type: integer
  /accounttransfers:
    post:
      summary: Create internal fund transfer
      tags:
      - Account Transfers
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fromOfficeId
              - fromClientId
              - fromAccountType
              - fromAccountId
              - toOfficeId
              - toClientId
              - toAccountType
              - toAccountId
              - transferDate
              - transferAmount
              - transferDescription
              - locale
              - dateFormat
              properties:
                fromOfficeId:
                  type: integer
                  example: 1
                fromClientId:
                  type: integer
                  example: 6
                fromAccountType:
                  type: integer
                  example: 2
                fromAccountId:
                  type: integer
                  example: 6
                toOfficeId:
